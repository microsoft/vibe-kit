# MANIFEST.yml v1.0

kit_info:
  name: "dayhoff"
  display_name: "Dayhoff Atlas Innovation Kit"
  version: "0.1.0"
  description: "Hybrid Mamba + Transformer protein modeling for rapid sequence design and scoring"
  created_date: "2025-10-07"
  last_updated: "2025-12-11"

research_foundation:
  paper_title: "The Dayhoff Atlas: scaling sequence diversity for improved protein generation"
  paper_url: "https://aka.ms/dayhoff/preprint"
  authors: ["Microsoft Research Dayhoff Team"]
  publication_venue: "bioRxiv"
  publication_year: 2025
  github_repo: "https://github.com/microsoft/dayhoff"

prototyping:
  time_to_first_success: "10 minutes"
  time_to_real_application: "8 hours"
  primary_domains: ["protein_design", "synthetic_biology", "drug_discovery"]
  secondary_domains: ["evolutionary_biology", "wet_lab_triage", "structure_prediction"]

files:
  core_files:
    - {file: "INNOVATION_KIT.md", lines: 28, desc: "Kit overview and entry point", time: "3min"}
    - {file: "docs/quick-start.md", lines: 73, desc: "First working example", time: "10min"}
    - {file: "docs/data-integration.md", lines: 84, desc: "Dayhoff Atlas dataset loading", time: "20min"}
    - {file: "docs/application-patterns.md", lines: 135, desc: "Use cases & workflows", time: "45min"}
    - {file: "docs/prototype-expansion.md", lines: 145, desc: "Extending the reference app", time: "30min"}
    - {file: "docs/alignment-constitution.md", lines: 85, desc: "Biosecurity guardrails & screening checklist", time: "5min"}
    - {file: "docs/troubleshooting.md", lines: 26, desc: "Common issues and fixes", time: "as-needed"}
    - {file: "docs/performance-guide.md", lines: 64, desc: "GPU sizing and optimization", time: "30min"}
    - {file: "customizations/Dayhoff Protein Design.chatmode.md", lines: 200, desc: "AI assistant chat mode", time: "5min"}
    - {file: "customizations/dayhoff-innovation-kit.instructions.md", lines: 150, desc: "GitHub Copilot routing instructions", time: "5min"}
  advanced_files: []
  enterprise: {requirements: ["Azure AI Foundry endpoint", "Azure Storage"], setup_time: "5min"}
  individual: {requirements: ["Python 3.10", "torch>=2.0", "16GB RAM"], setup_time: "15min"}

technical:
  languages: ["python", "typescript"]
  dependencies: ["torch>=2.0", "transformers>=4.30", "datasets>=2.15", "requests>=2.31", "flask>=2.3", "flask-cors>=4.0"]
  frontend_dependencies: ["react>=18", "vite>=5", "typescript>=5"]
  hardware:
    minimum: {ram: "16GB", storage: "8GB", compute: "CPU"}
    recommended: {ram: "32GB", storage: "20GB", compute: "GPU 16GB"}

quality_metrics:
  validation_status: "draft"
  last_validation_date: "2025-12-11"
  alignment_level: "baseline"
  success_metrics: {first_success_rate: 80, completion_rate: 65}
  known_limitations: ["Fitness calibration heuristic requires benchmark alignment"]

integration:
  compatible_kits: ["azure-ml"]
  external_apis:
    - {name: "Azure AI Foundry", type: "recommended"}

context_management:
  priority_files: ["INNOVATION_KIT.md", "docs/quick-start.md", "docs/alignment-constitution.md", "docs/troubleshooting.md", "docs/prototype-expansion.md"]
  context_tokens: {total_kit: 15000, core_files: 10500, recommended_load: 6000}

post_install:
  instructions_markdown: |
    1. **Reload the VS Code window** with CTRL+SHIFT+P -> Developer: Reload Window. This ensures the GitHub Copilot customizations are loaded.
    2. **Switch chat modes** – In GitHub Copilot Chat, set the mode (CTRL+.) to the **Dayhoff Protein Design** chat mode.
    3. **Launch the reference app** – Ask the Dayhoff chat mode: "start the reference app" to launch the interactive web interface for sequence generation.
    4. **Review safety guardrails** – Read `docs/alignment-constitution.md` before exporting or sharing any generated sequences.
    5. **Explore workflows** – Ask Copilot about mutation scoring, motif extension, or dataset integration as needed.