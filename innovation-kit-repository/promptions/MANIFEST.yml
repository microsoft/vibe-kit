# MANIFEST.yml v1.0

kit_info:
  name: "promptions"
  display_name: "Promptions Innovation Kit"
  version: "0.1.0"
  description: "Dynamic prompt middleware that turns chat history into ephemeral option controls."
  created_date: "2025-10-27"
  last_updated: "2026-03-02"

research_foundation:
  paper_title: "Dynamic Prompt Middleware for Generative AI"
  paper_url: "https://arxiv.org/abs/2412.02357"
  authors: ["Sean Rintel", "Jack Williams", "Microsoft Research Promptions Team"]
  publication_venue: "CHIWORK"
  publication_year: 2025
  github_repo: "https://github.com/microsoft/Promptions"

prototyping:
  time_to_first_success: "10 minutes"
  time_to_real_application: "8 hours"
  primary_domains: ["customer_support", "content_operations", "analytics"]
  secondary_domains: ["marketing", "education", "governance"]

files:
  core_files:
    - {file: "SKILL.md", lines: 90, desc: "Agent skill definition", time: "5min"}
    - {file: "docs/launch-procedure.md", lines: 180, desc: "Deterministic demo launch procedure", time: "5min"}
    - {file: "docs/promptions-prototyping-coach.md", lines: 52, desc: "Guided prototyping prompts", time: "5min"}
    - {file: "docs/quick-start.md", lines: 160, desc: "Integration tutorial", time: "10min"}
    - {file: "examples/control-schema.ts", lines: 100, desc: "Type definitions and schema", time: "5min"}
    - {file: "examples/generate-controls.ts", lines: 70, desc: "Control generation", time: "5min"}
    - {file: "examples/validate-controls.ts", lines: 115, desc: "Validation utilities", time: "5min"}
    - {file: "examples/replay-selections.ts", lines: 75, desc: "Selection replay", time: "5min"}
    - {file: "examples/render-controls.tsx", lines: 130, desc: "React/Fluent UI component", time: "8min"}
    - {file: "docs/application-patterns.md", lines: 180, desc: "Use cases and patterns", time: "25min"}
    - {file: "docs/data-integration.md", lines: 100, desc: "Transcript + telemetry ingestion", time: "15min"}
    - {file: "docs/troubleshooting.md", lines: 30, desc: "Triage checklist", time: "5min"}
    - {file: "docs/performance-guide.md", lines: 60, desc: "Optimization guidance", time: "10min"}
  advanced_files:
    - {file: "docs/REFERENCE.md", lines: 211, desc: "Complete schema reference", time: "15min"}

setup:
  enterprise:
    requirements: ["Azure subscription", "Azure OpenAI deployment (gpt-5)"]
    setup_time: "15min"
  individual:
    requirements: ["Node.js 18+", "corepack (ships with Node.js)", "OpenAI API key"]
    setup_time: "10min"

technical:
  languages: ["javascript", "typescript"]
  dependencies: ["openai>=4.0.0", "@azure/openai>=1.0.0", "dotenv>=16.0.0"]
  hardware:
    minimum: {ram: "8GB", storage: "1GB", compute: "CPU"}
    recommended: {ram: "16GB", storage: "5GB", compute: "CPU"}

quality_metrics:
  validation_status: "tested"
  last_validation_date: "2026-03-02"
  success_metrics: {first_success_rate: 92, completion_rate: 78}
  known_limitations: ["Relies on external LLM availability", "JSON schema enforcement needed to prevent malformed options"]

integration:
  compatible_kits: ["vibe-kit-core"]
  external_apis:
    - {name: "OpenAI Chat Completions", type: "required", purpose: "Generate and replay dynamic controls"}
    - {name: "Azure OpenAI", type: "optional", purpose: "Enterprise-hosted model compatibility"}

post_install:
  instructions_markdown: |
    1. **Reload the VS Code window** with CTRL+SHIFT+P -> Developer: Reload Window. This ensures the GitHub Copilot customizations are loaded.
    2. **Configure credentials** – Open `.vibe-kit/innovation-kits/promptions/.env` and set `OPENAI_API_KEY` (or Azure OpenAI equivalents).
    3. **Run the quick start** – Ask Copilot to launch the Promptions demo or follow `docs/quick-start.md`.
    4. **Review implementation patterns** – Use `docs/application-patterns.md` and `docs/data-integration.md` when integrating with your product workflow.
    5. **Debug and optimize** – Use `docs/troubleshooting.md` and `docs/performance-guide.md` for runtime issues and tuning.

context_management:
  priority_files: ["docs/quick-start.md", "docs/application-patterns.md", "docs/troubleshooting.md"]
  context_tokens:
    total_kit: 11000
    core_files: 7800
    recommended_load: 4000