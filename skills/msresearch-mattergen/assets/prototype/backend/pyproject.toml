[project]
name = "mattergen-prototype-backend"
version = "0.1.0"
description = "FastAPI backend for MatterGen+MatterSim prototype web app"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  # Dependencies for energy_above_hull computation
  "lmdb>=1.4.0",
  "pymatgen>=2024.1.0",
  "numpy>=1.24.0",
  "monty>=2024.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
